# Real values for the gha-runners-1 consumer. Not read by the chart itself --
# pass explicitly to regenerate manifests/gha-runners-1/tailscale/tailscale.yaml
# in the sre repo:
#
#   helm template gha-runners-1-tailscale . -f examples/gha-runners-1-values.yaml
#
# then diff/paste the relevant sections back into the committed static yaml
# (that Application syncs a plain directory, not this chart, so nothing here
# is applied automatically).

podMonitoring: {}

customResourceState: {}

proxyClasses:
  appc-github: # HA app connector: 2+ replicas need their own spread/PDB, same as an exit node
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
    podDisruptionBudget:
      minAvailable: 1
    resources:
      requests: # no cpu limit: let it burst freely, cap only the baseline
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 512Mi
    metrics:
      enable: true # also auto-sets TS_LOCAL_ADDR_PORT/TS_ENABLE_METRICS below, don't repeat them
    podMonitoring: {} # GMP scrape of the metrics above, requires metrics.enable: true
    env:
      - name: TS_ENABLE_HEALTH_CHECK
        value: "true" # serves /healthz on the same port metrics.enable uses
  peer-relay: # referenced by peerRelays[].proxyClass below
    topologySpreadConstraints: # spreads replicas across zones and nodes
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
    podDisruptionBudget:
      minAvailable: 1
    resources:
      requests: # no cpu limit: GOMAXPROCS=1 below caps it to a single core anyway
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 512Mi
    # metrics.enable is a no-op for PeerRelay proxies (confirmed against
    # upstream source, github.com/tailscale/tailscale
    # k8s-operator/reconciler/tailscaled): wire it manually via env instead,
    # and point podMonitoring.port at the port that's actually there.
    podMonitoring:
      port: healthz
    env:
      - name: TS_ENABLE_METRICS
        value: "true"
      # Pins the socket-reader/wireguard-go pool count to 1: those scale
      # per-CPU visible to the container, not per actual load, so on
      # high-core nodes memory balloons well past the limit above.
      # https://github.com/tailscale/tailscale/issues/18774
      - name: GOMAXPROCS
        value: "1"
    # Don't set env: TS_ENABLE_HEALTH_CHECK here -- the operator's
    # peerrelay-reconciler injects it itself, and a duplicate entry makes
    # the StatefulSet apply fail outright (no pods ever come up).

connectors:
  - name: appc-github
    # HA app connector: multiple app connector devices give failover, not
    # closest-node routing -- Tailscale docs describe this as failover only.
    # https://tailscale.com/kb/1281/app-connectors
    replicas: 2
    hostnamePrefix: appc-github
    proxyClass: appc-github
    tags:
      - "tag:github-connector"
    appConnector: {} # routes auto-discovered via DNS once domains are set in Apps

peerRelays:
  - name: peer-relay
    proxyClass: peer-relay
    tags:
      - "tag:peer-relay"

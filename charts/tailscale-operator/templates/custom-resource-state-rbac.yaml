{{- if and (hasKey .Values "customResourceState") (kindIs "map" .Values.customResourceState) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tailscale-operator.customResourceState.name" . }}
  namespace: {{ .Release.Namespace }}
---
# Cluster-scoped: Connector and PeerRelay are cluster-scoped, and CRS also
# list/watches CRDs. Binding name includes release and namespace so two
# installs of this chart don't collide (same as oidc-discovery-rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tailscale-operator.customResourceState.clusterRoleName" . }}
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - list
      - watch
  - apiGroups:
      - tailscale.com
    resources:
      - connectors
      - peerrelays
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tailscale-operator.customResourceState.clusterRoleName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tailscale-operator.customResourceState.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tailscale-operator.customResourceState.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- range $name, $pc := .Values.proxyClasses }}
---
# Applied after the operator/CRDs (default sync-wave) so the ProxyClass CRD
# already exists when this is applied.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  statefulSet:
    pod:
      labels:
        app: {{ $name }}
      {{- if $pc.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range $pc.topologySpreadConstraints }}
        - labelSelector:
            matchLabels:
              app: {{ $name }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- if $pc.resources }}
      tailscaleContainer:
        resources:
          {{- toYaml $pc.resources | nindent 10 }}
      {{- end }}
{{- end }}

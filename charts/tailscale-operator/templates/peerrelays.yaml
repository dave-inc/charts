{{- range .Values.peerRelays }}
{{- if not .name }}
{{- fail "peerRelays[]: name is required" }}
{{- end }}
{{- if and (hasKey . "replicas") (lt (int .replicas) 0) }}
{{- fail (printf "peerRelays[%s]: replicas cannot be negative" .name) }}
{{- end }}
{{- if .proxyClass }}
{{- if not (hasKey ($.Values.proxyClasses | default dict) .proxyClass) }}
{{- fail (printf "peerRelays[%s]: proxyClass %q does not match a key in proxyClasses" .name .proxyClass) }}
{{- end }}
{{- end }}
---
# Applied after the operator/CRDs (default sync-wave) so the PeerRelay CRD
# already exists when this is applied.
#
# PeerRelay is cluster-scoped (github.com/tailscale/tailscale
# cmd/k8s-operator/deploy/crds/tailscale.com_peerrelays.yaml), and its name
# below is the raw peerRelays[].name, not prefixed by release or namespace --
# same rationale as Connector/ProxyClass above: one release per cluster (see
# README.md#usage), so there's no other release's PeerRelays to collide
# with.
#
# Unlike Connector, PeerRelay has no singular `hostname` field -- every
# replica gets `hostnamePrefix` plus its StatefulSet ordinal, even when
# replicas is 1, so hostnamePrefix is always rendered here.
apiVersion: tailscale.com/v1alpha1
kind: PeerRelay
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  hostnamePrefix: {{ .hostnamePrefix | default .name }}
  {{- if hasKey . "replicas" }}
  replicas: {{ .replicas }}
  {{- end }}
  {{- if .tags }}
  tags:
    {{- toYaml .tags | nindent 4 }}
  {{- end }}
  {{- if .proxyClass }}
  proxyClass: {{ .proxyClass }}
  {{- end }}
  {{- if .tailnet }}
  tailnet: {{ .tailnet }}
  {{- end }}
  {{- if .service }}
  service:
    {{- toYaml .service | nindent 4 }}
  {{- end }}
  {{- if .aws }}
  aws:
    {{- toYaml .aws | nindent 4 }}
  {{- end }}
{{- end }}

suite: Custom Resource State RBAC
templates:
  - custom-resource-state-rbac.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: treats a null customResourceState value as unset
    set:
      customResourceState: null
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a ServiceAccount in the release namespace
    release:
      namespace: tailscale
    set:
      customResourceState: {}
    asserts:
      - documentIndex: 0
        isKind:
          of: ServiceAccount
      - documentIndex: 0
        equal:
          path: metadata.name
          value: custom-resource-state-exporter
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: tailscale

  - it: grants list/watch on Connector, PeerRelay, and CRDs
    set:
      customResourceState: {}
    asserts:
      - documentIndex: 1
        isKind:
          of: ClusterRole
      - documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups:
              - apiextensions.k8s.io
            resources:
              - customresourcedefinitions
            verbs:
              - list
              - watch
      - documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups:
              - tailscale.com
            resources:
              - connectors
              - peerrelays
            verbs:
              - list
              - watch

  - it: scopes ClusterRole and ClusterRoleBinding names to the release and namespace
    release:
      name: my-cluster
      namespace: tailscale
    set:
      customResourceState: {}
    asserts:
      - documentIndex: 1
        equal:
          path: metadata.name
          value: my-cluster-tailscale-operator-tailscale-crs
      - documentIndex: 2
        isKind:
          of: ClusterRoleBinding
      - documentIndex: 2
        equal:
          path: metadata.name
          value: my-cluster-tailscale-operator-tailscale-crs
      - documentIndex: 2
        equal:
          path: subjects[0].namespace
          value: tailscale

  - it: gives the same release name in a different namespace a distinct binding name
    release:
      name: my-cluster
      namespace: other-namespace
    set:
      customResourceState: {}
    asserts:
      - documentIndex: 2
        equal:
          path: metadata.name
          value: my-cluster-tailscale-operator-other-namespace-crs

  - it: doesn't collide two namespaces once the release name alone already fills the old 63-char cap
    # "tailscale-operator.fullname" truncates at 63 chars on its own, so once
    # the release name pushes it there, re-truncating clusterRoleName at 63
    # (the old behavior) drops the namespace and "-crs" suffix entirely --
    # both namespaces below would render the exact same ClusterRole name.
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      namespace: ns-one
    set:
      customResourceState: {}
    asserts:
      - documentIndex: 1
        equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-tailscale-op-ns-one-crs

  - it: and the other namespace gets a different name, not the same truncated one
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      namespace: ns-two
    set:
      customResourceState: {}
    asserts:
      - documentIndex: 1
        equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-tailscale-op-ns-two-crs

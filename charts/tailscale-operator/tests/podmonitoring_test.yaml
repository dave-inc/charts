suite: PodMonitoring
templates:
  - podmonitoring.yaml
tests:
  - it: renders nothing when no proxyClass requests it
    set:
      proxyClasses:
        gha-runners-1-exit-node:
          metrics:
            enable: true
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when podMonitoring is set without metrics.enable
    set:
      proxyClasses:
        gha-runners-1-exit-node:
          podMonitoring: {}
    asserts:
      - failedTemplate:
          errorMessage: "proxyClasses[gha-runners-1-exit-node].podMonitoring requires metrics.enable: true"

  - it: scopes the selector to the requesting proxyClass, defaulting the interval
    set:
      proxyClasses:
        gha-runners-1-exit-node:
          metrics:
            enable: true
          podMonitoring: {}
        gha-runners-2-exit-node: {}
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: gha-runners-1-exit-node
      - equal:
          path: spec.selector.matchLabels.proxy-class
          value: gha-runners-1-exit-node
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].interval
          value: "30s"

  - it: allows overriding the scrape interval
    set:
      proxyClasses:
        gha-runners-1-exit-node:
          metrics:
            enable: true
          podMonitoring:
            interval: 15s
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: "15s"

  - it: fails when podMonitoring overrides the auto-filled selector
    set:
      proxyClasses:
        gha-runners-1-exit-node:
          metrics:
            enable: true
          podMonitoring:
            selector:
              matchLabels:
                app: something-else
    asserts:
      - failedTemplate:
          errorMessage: "proxyClasses[gha-runners-1-exit-node].podMonitoring: selector is set automatically and must not be overridden"

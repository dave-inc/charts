{{- if and .Values.autoscaling.enabled .Values.canary.enabled }}
{{- $canaryAuto := .Values.canary.autoscaling | default dict -}}
{{- $max := $canaryAuto.maxReplicas | default .Values.autoscaling.maxReplicas -}}
{{- /* No cap on $min here, unlike hpa-rproxy.yaml. That template raises an inherited
minimum to 2 itself, outside the helper, so it has to contain its own raise. This one
only asks common.minReplicas, which is handed the $max above and caps its canary default
against it, so the default cannot exceed maxReplicas. An explicit min above max is left
as written either way, to be surfaced by the API server rather than masked. */ -}}
{{- $min := include "common.minReplicas" (dict "ctx" . "max" $max) -}}
{{- /* Not coalesce: an explicit override wins outright, including 1. */ -}}
{{- if not (kindIs "invalid" $canaryAuto.minReplicas) -}}
{{- $min = $canaryAuto.minReplicas | int -}}
{{- end -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "common.canaryName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "common.canaryName" . }}
  minReplicas: {{ $min }}
  maxReplicas: {{ $max }}
  metrics:
    {{- toYaml .Values.autoscaling.metrics | nindent 4 }}
  {{- if .Values.hpaBehavior.enabled }}
  behavior:
    {{- toYaml .Values.hpaBehavior.behavior | nindent 4 }}
  {{- end }}
{{- end }}

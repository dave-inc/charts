{{- /*
Gated on common.canaryTrafficRoutingEnabled, not just canary being on: this
Service only exists to be a traffic-routing target (see its doc comment in
_helpers.tpl), so it would be an orphaned object whenever traffic routing
isn't actually active -- e.g. a public-facing (cloudArmor.enabled) deployment
today, since Gateway API isn't set up to handle public-facing traffic yet.
*/}}
{{- if and .Values.service.enabled (include "common.canaryTrafficRoutingEnabled" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.canaryServiceName" . }}
  annotations:
    # -1 satisfies two separate ordering needs at once: it's still before the
    # Gateway API HTTPRoute (wave 2), whose backendRefs need both Rollouts-managed
    # Services to exist before that reconciliation begins, and it's also ahead of
    # the default wave (0) that a service migrating off a now-removed tier prunes
    # that tier's resources in - see service.yaml's own comment for why that
    # ordering matters. A Service can exist with no endpoints before its target
    # Pods do, so moving this earlier than strictly required by the HTTPRoute has
    # no downside.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.deploymentContainer.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "common.selectorLabels" . | nindent 4 }}
{{- end }}

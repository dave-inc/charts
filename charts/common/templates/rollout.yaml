{{- if (include "common.canaryEnabled" .) }}
{{- /*
References the plain apps/v1 Deployment (deployment.yaml) via workloadRef
instead of duplicating its pod template, per
https://argo-rollouts.readthedocs.io/en/stable/migrating/. This Rollout has
no .spec.template of its own - Argo Rollouts copies it from the referenced
Deployment and runs its canary/stable ReplicaSets alongside it, scaling the
Deployment down per canary.scaleDown once this Rollout is healthy.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "common.name" . }}
  annotations:
    # Wave 2 creates the Gateway API HTTPRoute whose weights the Rollouts
    # traffic-routing plugin manages. Applying the Rollout afterward prevents
    # it from reconciling before that required route exists.
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  {{- /*
  HPA/VPA/KEDA scaleTargetRef points at this Rollout (see
  common.workloadKind) when canary is enabled, so skip replicas here the
  same way deployment.yaml would.
  */}}
{{- if not (kindIs "invalid" .Values.canary.initialReplicas) }}
  {{- /*
  canary.initialReplicas is the one exception to the rule above: it renders
  replicas here even though autoscaling/kedaScaling is enabled. On this
  Rollout's first-ever revision there is no prior stable revision to canary
  against, so Argo Rollouts skips canary steps entirely and promotes as soon
  as its *current* replicas count is Ready -- and workloadRef.scaleDown then
  retires the old Deployment's real capacity in the same instant. Left
  omitted (the normal case below), that current count is whatever the HPA
  has last reconciled onto this Rollout, which on a brand-new object is
  Kubernetes' own implicit default of 1 -- not this service's real
  steady-state size -- until the HPA's own reconcile loop catches up.
  Set this to the service's actual current replica count for the one sync
  that first turns canary on, so the Rollout starts at real capacity
  instead of racing the HPA; remove it once confirmed (e.g. `kubectl argo
  rollouts get rollout`) to hand replica count back to the HPA for good.
  */}}
  replicas: {{ .Values.canary.initialReplicas }}
{{- else if not (or .Values.autoscaling.enabled .Values.kedaScaling.enabled) }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  {{- /*
  workloadRef only copies the referenced Deployment's .spec.template (hence its
  terminationGracePeriodSeconds/preStop already apply here) - minReadySeconds is a
  sibling field on the Rollout's own spec, not part of that template, so it is not
  inherited and must be set here too. Without it this defaults to 0, which is the
  exact gap staging testing on bei-test-service found: a Pod whose endpoint hasn't
  yet been attached to its NEG (or detached from an old one) can still count as
  Available the instant it passes readiness, serving 503s until the LB catches up.
  See deployment.yaml's own minReadySeconds for the non-canary equivalent.
  */}}
  {{- $minReadySeconds := include "common.gracefulRolloutValue" (dict "ctx" . "field" "minReadySeconds") }}
  {{- if gt ($minReadySeconds | default 0 | int) 0 }}
  minReadySeconds: {{ $minReadySeconds }}
  {{- end }}
  revisionHistoryLimit: 5
  rollbackWindow:
    revisions: 2
  selector:
    matchLabels:
    {{- if not .Values.podSelectorLabelsOverride }}
      {{- include "common.selectorLabels" . | nindent 6 }}
    {{- end }}
    {{- if .Values.podSelectorLabelsOverride }}
      {{- .Values.podSelectorLabelsOverride | toYaml | nindent 6 }}
    {{- end }}
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "common.name" . }}
    scaleDown: {{ .Values.canary.scaleDown }}
  strategy:
    canary:
      {{- if (include "common.canaryTrafficRoutingEnabled" .) }}
      canaryService: {{ include "common.canaryServiceName" . }}
      stableService: {{ include "common.stableServiceName" . }}
      {{- end }}
      maxSurge: {{ .Values.canary.maxSurge | quote }}
      maxUnavailable: {{ .Values.canary.maxUnavailable }}
      {{- /*
      Argo Rollouts' own validation rejects scaleDownDelaySeconds outright
      ("Canary scaleDownDelaySeconds can only be used with traffic routing")
      whenever trafficRouting isn't actually present below -- which, during the
      canary.initialReplicas warm-up window (global.canary.enabled still
      false), it deliberately isn't. Must gate on the exact same condition
      that decides whether the trafficRouting block below renders, not just
      "is a value set" -- confirmed live on service-template-test-service,
      where omitting this check degraded the Rollout (InvalidSpec) during
      that window.
      */}}
      {{- $trafficRoutingWillRender := or .Values.canary.trafficRouting (and (include "common.canaryTrafficRoutingEnabled" .) (dig "canary" "enabled" false (default dict .Values.global))) }}
      {{- if and $trafficRoutingWillRender (not (kindIs "invalid" .Values.canary.scaleDownDelaySeconds)) }}
      scaleDownDelaySeconds: {{ .Values.canary.scaleDownDelaySeconds | int }}
      {{- end }}
      {{- if .Values.canary.trafficRouting }}
      trafficRouting:
        {{- toYaml .Values.canary.trafficRouting | nindent 8 }}
      {{- else if and (include "common.canaryTrafficRoutingEnabled" .) (dig "canary" "enabled" false (default dict .Values.global)) }}
      {{- /*
      Zero-config default: an HTTPRoute named after this app (the same
      `common.name` convention canary/stable Services already use) is assumed
      to exist -- see the `gatewayapi` chart's stable+canary backendRef
      expansion. Set `canary.trafficRouting` explicitly to use a different
      traffic router (nginx/istio/alb/smi) or to point at a differently-named
      HTTPRoute, or set it to `false` to fall back to basic weighted-replica
      canary with no traffic-routing resource at all.

      This default only renders when common.canaryTrafficRoutingEnabled
      resolves true -- see its doc comment in _helpers.tpl for the full
      resolution order, including why cloudArmor.enabled (a public-facing
      deployment) also disables this default today -- AND when the raw
      global.canary.enabled is true, deliberately checked again here instead
      of trusting common.canaryEnabled alone. canary.initialReplicas can force
      common.canaryEnabled true on its own, specifically so the Rollout and
      its Services can exist and warm up before global.canary.enabled flips
      (see common.canaryEnabled's doc comment in _helpers.tpl). If this block
      used that same already-forced result, the Rollout would try to manage
      weights on a `gatewayapi` HTTPRoute that hasn't expanded its
      backendRefs yet, which hard-errors every reconcile -- the exact
      deadlock this chart hit before. canaryService/stableService above are
      unaffected by this extra check, so the Services still warm up normally
      either way.

      namespace is required here even though the HTTPRoute lives in this same
      Release's namespace: the gatewayAPI plugin does not default an empty
      namespace to the Rollout's own, it errors reconciling with "an empty
      namespace may not be set when a resource name is provided", which is
      fatal enough to block the Rollout from ever going healthy.
      */}}
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: {{ include "common.name" . }}
            namespace: {{ .Release.Namespace }}
      {{- end }}
      {{- if .Values.canary.analysis }}
      analysis:
        {{- toYaml .Values.canary.analysis | nindent 8 }}
      {{- end }}
      {{- /*
      Ephemeral metadata: the deployment-group label is only meaningful per
      ReplicaSet role (stable vs canary), which flips on promotion. A static
      label on the pod template can't express that for a single shared
      template, so it's applied here instead, and Argo Rollouts adds/removes
      it on the relevant ReplicaSet's pods as their role changes.
      https://argo-rollouts.readthedocs.io/en/stable/features/ephemeral-metadata/
      */}}
      canaryMetadata:
        labels:
          deployment-group: "canary"
      stableMetadata:
        labels:
          deployment-group: "stable"
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
{{- end }}

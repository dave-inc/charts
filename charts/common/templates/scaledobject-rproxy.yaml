{{- if and .Values.canary.enabled .Values.canary.reverseProxy.kedaScaling.enabled }}
{{- /* Independent enable flag, not .Values.kedaScaling.enabled - mirrors hpa-rproxy.yaml, whose
plain-HPA equivalent is gated on canary.reverseProxy.autoscaling.enabled alone, independent of the
root autoscaling.enabled. Keeping the KEDA path independent the same way means the rproxy tier can
be migrated on its own two-sync schedule without being forced to match the main deployment's. */}}
{{- $rpKeda := .Values.canary.reverseProxy.kedaScaling }}
{{- $max := (.Values.autoscaling.maxReplicas | int) }}
{{- if not (kindIs "invalid" $rpKeda.maxReplicas) }}
{{- $max = ($rpKeda.maxReplicas | int) }}
{{- end }}
{{- /* The rproxy is the tier fronted by the NEG, so one replica is one endpoint, and a rollout or
a zone move can leave the load balancer with nothing to route to. Floor the inherited minimum at 2
rather than giving the field a default, which would then be preferred over a service's own larger
inherited value. Kept at or below maxReplicas so a deliberately pinned single-replica service still
renders. Matches hpa-rproxy.yaml. */}}
{{- $min := min (max (include "common.minReplicas" (dict "ctx" . "max" $max) | int) 2) $max }}
{{- /* Not coalesce: an explicit override wins outright, including 1 - matches hpa-rproxy.yaml. */}}
{{- if not (kindIs "invalid" $rpKeda.minReplicas) }}
{{- $min = ($rpKeda.minReplicas | int) }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "common.reverseProxyName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "common.reverseProxyName" . }}
  minReplicaCount: {{ $min }}
  maxReplicaCount: {{ $max }}
  {{- if not (kindIs "invalid" .Values.kedaScaling.pollingInterval) }}
  pollingInterval: {{ .Values.kedaScaling.pollingInterval | int }}
  {{- end }}
  {{- if .Values.kedaScaling.fallback.enabled }}
  {{- $fallbackReplicas := $min }}
  {{- if not (kindIs "invalid" .Values.kedaScaling.fallback.replicas) }}
  {{- $fallbackReplicas = (.Values.kedaScaling.fallback.replicas | int) }}
  {{- end }}
  {{- $failureThreshold := 3 }}
  {{- if not (kindIs "invalid" .Values.kedaScaling.fallback.failureThreshold) }}
  {{- $failureThreshold = (.Values.kedaScaling.fallback.failureThreshold | int) }}
  {{- end }}
  fallback:
    failureThreshold: {{ $failureThreshold }}
    replicas: {{ $fallbackReplicas }}
  {{- end }}
  {{- if .Values.hpaBehavior.enabled }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        {{- toYaml .Values.hpaBehavior.behavior | nindent 8 }}
  {{- end }}
  {{- /* Same trigger source as the main ScaledObject - matches hpa-rproxy.yaml, which falls back
  to root .Values.autoscaling.metrics via coalesce when no rproxy-specific override is set. No
  rproxy-specific trigger override exists here since nothing in this chart's real usage needed one
  yet (the rproxy tier has always scaled on the same signal as the deployment it fronts). */}}
  triggers:
    {{- toYaml .Values.kedaScaling.triggers | nindent 4 }}
{{- end }}

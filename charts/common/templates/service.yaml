{{- if and .Values.canary.enabled .Values.service.appProtocol -}}
{{- fail "service.appProtocol is not supported when canary.enabled is true" -}}
{{- end -}}
{{- if .Values.service.enabled -}}
{{- $name := .Values.service.name | default (include "common.name" .) -}}
{{- $annotations := .Values.service.annotations | default dict -}}
{{/*
service.copies renders one extra Service per item, named "<name>-<suffix>" and selecting
the same Pods. `default dict` is what makes a values file written before the feature safe:
$copies is then always a map, so reading .enabled off it cannot dereference a missing one.
That, copies.enabled: false and an empty items list all reduce to an empty range, which
renders the base Service alone. Each item is validated by values.schema.json; the two
things a schema cannot see are checked by common.validateServiceCopies.
*/}}
{{- $copies := .Values.service.copies | default dict -}}
{{- $items := list -}}
{{- if $copies.enabled -}}
{{- $items = $copies.items | default list -}}
{{- end -}}
{{- include "common.validateServiceCopies" (dict "name" $name "items" $items) -}}
{{- include "common.v2.serviceObject" (dict "root" . "name" $name "type" .Values.service.type "port" .Values.service.port "appProtocol" .Values.service.appProtocol "annotations" $annotations "canary" .Values.canary.enabled) }}
{{- range $items }}
{{/*
An item's canary picks its selector: unset inherits canary.enabled, false sends the copy
straight to the control Pods even under canary, true sends it to the reverse proxy. true
without canary.enabled fails, since there is no reverse proxy for it to select. kindIs
"bool" is what tells an explicit false apart from unset. appProtocol is checked against
the resolved value, inherited or not, because only the nginx path cannot carry it.
*/}}
{{- $copyCanary := $.Values.canary.enabled -}}
{{- if kindIs "bool" .canary -}}
{{- $copyCanary = .canary -}}
{{- end -}}
{{- if and $copyCanary (not $.Values.canary.enabled) -}}
{{- fail (printf "service.copies.items[]: canary: true for suffix %q requires canary.enabled: true, there is no reverse proxy to select" .suffix) -}}
{{- end -}}
{{- if and $copyCanary (.appProtocol | default $.Values.service.appProtocol) -}}
{{- fail "service.copies.items[].appProtocol is not supported when canary.enabled is true" -}}
{{- end -}}
{{/*
An item inherits anything it does not set. Annotations are replaced, not merged: an item
that sets them gets exactly its own map, so a base annotation such as a BackendConfig
cannot follow a copy that exists to point somewhere else. hasKey is what tells an explicit
{} (no annotations at all) apart from unset (inherit the base's).
*/}}
{{- $copyAnnotations := $annotations -}}
{{- if hasKey . "annotations" -}}
{{- $copyAnnotations = .annotations | default dict -}}
{{- end }}
---
{{ include "common.v2.serviceObject" (dict
     "root" $
     "name" (printf "%s-%s" $name .suffix)
     "type" (.type | default $.Values.service.type)
     "port" (.port | default $.Values.service.port)
     "appProtocol" (.appProtocol | default $.Values.service.appProtocol)
     "annotations" $copyAnnotations
     "canary" $copyCanary) }}
{{- end }}
{{- end }}

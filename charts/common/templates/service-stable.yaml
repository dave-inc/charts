{{- if and .Values.service.enabled (include "common.canaryEnabled" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.stableServiceName" . }}
  annotations:
    # The Gateway API HTTPRoute is applied in wave 2. Its backendRefs need both
    # Rollouts-managed Services to exist before that reconciliation begins.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.deploymentContainer.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "common.selectorLabels" . | nindent 4 }}
{{- end }}

# Default values for common.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

# Used for NODE_ENV and DD_ENV
environment: staging
# Required: GCP Project where this Release will be deployed
project: ""

# Init container must have a name, image and command to run before
# deployContainer initializes.  Both containers share a /tmp volume mount.
initContainer:
  enabled: false
  name: "setup"
  image: "alpine:latest"
  command: ["sh", "-c", "touch /tmp/this"]

deploymentContainer:
  command: []
  args: []
  port: 8080

  # https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # Default probe mechanism httpGet, if a different mechanism is needed use customLivenessProbe and customReadinessProbe

  # livenessProbe:
  #   path: /
  #   port: ""
  #   httpHeaders:
  #     - name: Custom-Header
  #       value: Awesome
  #   failureThreshold: 3
  #   initialDelaySeconds: 0
  #   periodSeconds: 10
  #   successThreshold: 1
  #   timeoutSeconds: 1

  # readinessProbe:
  #   path: /
  #   port: ""
  #   httpHeaders:
  #     - name: Custom-Header
  #       value: Awesome
  #   failureThreshold: 3
  #   initialDelaySeconds: 0
  #   periodSeconds: 10
  #   successThreshold: 1
  #   timeoutSeconds: 1

  # startupProbe:
  #   path: /
  #   port: ""
  #   httpHeaders:
  #     - name: Custom-Header
  #       value: Awesome
  #   failureThreshold: 3
  #   initialDelaySeconds: 0
  #   periodSeconds: 10
  #   successThreshold: 1
  #   timeoutSeconds: 1

  # customlivenessProbe that overrides the default one
  # example:
  # customLivenessProbe:
  #   exec:
  #     command:
  #     - cat
  #     - /tmp/healthy
  #   initialDelaySeconds: 5
  #   periodSeconds: 5
  customLivenessProbe: {}

  # customReadinessProbe that overrides the default one
  #example:
  # customReadinessProbe:
  #   tcpSocket:
  #     port: 8080
  #   initialDelaySeconds: 15
  #   periodSeconds: 20
  customReadinessProbe: {}

  # customStartupProbe that overrides the default one
  customStartupProbe: {}

  ## If you want to add a preStop hook, or any other lifecycles to your
  ## deployment, you can define them here. This replaces the preStop sleep the chart
  ## would otherwise render from preStopSleepSeconds, so a hook set here is then
  ## responsible for the whole drain, and the chart stops checking it against
  ## terminationGracePeriodSeconds. Prefer preStopSleepSeconds if all you need is a
  ## drain window. Prefer the sleep action over an exec of /bin/sh: it needs no shell
  ## in the image.
  #lifecycle:
  # preStop:
  #   sleep:
  #     seconds: 20

# terminationGracePeriodSeconds is the whole budget for shutdown: the time from
# termination starting until the container is SIGKILLed, spanning both the preStop hook
# and the SIGTERM handling after it. It is a ceiling, not a delay, and on its own it
# does not keep a Pod in the traffic path. preStopSleepSeconds below does that.
#
# 31 is the long-standing default, kept here for workloads that are not in a traffic path,
# such as pubsub consumers and task handlers. With no drain to fund, the whole budget goes
# to the process finishing its in-flight work after SIGTERM. Must exceed the effective
# preStopSleepSeconds or the Pod is SIGKILLed mid-drain.
#
# This is the fallback value. A release with a Service takes
# serviceGracefulRollout.terminationGracePeriodSeconds instead, and that is where the
# reasoning for a longer budget lives.
#
# Applies to the control and canary Deployments. The reverse proxy inherits the effective
# value unless canary.reverseProxy.terminationGracePeriodSeconds is set.
terminationGracePeriodSeconds: 31

# Seconds a Pod keeps serving after termination begins, before its process is asked to
# shut down. Nothing else does this: terminationGracePeriodSeconds only caps the total
# shutdown, and the container otherwise exits as soon as it receives SIGTERM.
#
# 0 is the right default here, because this value is normally only reached by a workload
# with no Service. Nothing is routing to it, so there are no in-flight requests to hold
# open and no endpoint waiting to be withdrawn: a sleep would do nothing but make every
# shutdown slower. A release with a Service takes serviceGracefulRollout.preStopSleepSeconds
# instead, unless it has turned that block off, and that is where the sizing against load
# balancer endpoint removal lives.
#
# Raising this one is for the unusual case of a workload that is reached some other way
# and still needs a window. It must stay below terminationGracePeriodSeconds, or the
# render fails rather than let the Pod be SIGKILLed part-way through draining.
#
# Rendered as a preStop sleep on the control and canary application containers, unless
# deploymentContainer.lifecycle is set, which takes precedence and is then responsible
# for its own drain. The reverse proxy sleeps for the same duration before quitting
# nginx, unless canary.reverseProxy.preStopSleepSeconds is set.
preStopSleepSeconds: 0

image:
  repository: nginx
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

imagePullSecrets: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Controls whether the service account token is automatically mounted into pods.
  # Set to false to improve security if your app does not need to access the Kubernetes API.
  automountServiceAccountToken: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using Release.Name
  name: ""
  # IAM workload idenitity binding name
  # If not set and serviceAccount.create:true, a name is generated using Release.Name
  # If Release.Name is bigger than 30 characteres use this variable to overwrite it with something shorter to identify this workload
  workloadIdentitySA: ""
  # Specifies whether an existing service account will be used
  # Make sure you set serviceAccount.create:false when using this option
  # Dynamic environments will use of this one
  existingNameSA: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  enabled: true
  type: ClusterIP
  port: 80
  # The name of the service is optional, If not set, a name is generated using Release.Name
  # name: ""

# Graceful-rollout timing for a release that is actually in a traffic path. These three
# fields shadow their top-level counterparts, so a service can be timed against the load
# balancer in front of it without moving the defaults that everything else uses.
#
# It applies only when both service.enabled and serviceGracefulRollout.enabled are true,
# and both default true. So a service gets the values below, while a workload with no
# Service, such as a pubsub consumer or a task handler, falls back to the top level and
# is left on the plain defaults. Resolved by common.gracefulRolloutValue in
# templates/_helpers.tpl.
#
# Precedence, most specific first:
#
#   1. canary.reverseProxy.*    the per-tier override, reverse proxy only
#   2. serviceGracefulRollout.* this block, when it applies
#   3. top-level .Values.*      the default for everything else
#
# The block feeds the control and canary Deployments, the reverse proxy's base timing and
# the Cloud SQL proxy's derived wait, so all of them move together. Set enabled: false to
# put a service back on the top-level defaults.
serviceGracefulRollout:
  enabled: true

  # Seconds a new Pod must stay Ready before it counts as Available and the rollout
  # retires an old Pod. The top-level minReadySeconds covers what the field does and why
  # even a workload with no endpoints might want it; this is the separate reason a
  # service in a traffic path wants a minute of it.
  #
  # It covers the gap between a Pod being Ready and the data plane knowing about it. That
  # gap is worst behind container-native load balancing, where GKE marks the
  # load-balancer-neg-ready gate True before the NEG is attached to a health-checked
  # backend service, and Google recommends 60 or higher there. A ClusterIP-only service
  # has the same gap in miniature, since an EndpointSlice update still has to reach every
  # node and clients still hold pooled connections and cached DNS. Retire an old Pod
  # inside that gap and the traffic it was serving has nowhere ready to land.
  #
  # The cost is near constant rather than proportional to size: with the default 25%
  # surge and unavailable, a rollout moves in roughly four waves whatever the replica
  # count, so this adds about four minutes, felt most in an emergency rollback. Must stay
  # below progressDeadlineSeconds (600 by default) or the rollout is marked failed, which
  # leaves room for those four waves unless the container is also slow to start.
  minReadySeconds: 60

  # Seconds a Pod keeps serving after termination begins, before its process is asked to
  # shut down. Sized to cover both halves of a backend leaving a Google load balancer:
  #
  #   preStopSleepSeconds >= drainingTimeoutSec + endpoint removal latency
  #
  # Removal is not instant. It lagged the Pod being killed by ~12s in staging, and new
  # requests keep arriving until it lands, so 20 is that measurement with margin. Once
  # removed, the load balancer also holds existing connections for drainingTimeoutSec,
  # but that is 0 on our backend services today, so the removal latency is the only term
  # that binds. If connection draining is ever enabled, on a GCPBackendPolicy for Gateway
  # or a BackendConfig for Ingress, this has to grow to cover it as well, and
  # terminationGracePeriodSeconds below has to stay above this.
  preStopSleepSeconds: 20

  # The whole budget for shutdown, spanning the drain above and the SIGTERM handling
  # after it. 60 leaves the process around 40s to finish in-flight work once the 20s
  # preStop sleep is done.
  #
  # Must exceed preStopSleepSeconds. The render fails rather than let a Pod be SIGKILLed
  # part-way through draining, see common.validateDrainBudget in templates/_helpers.tpl.
  #
  # The Cloud SQL proxy sidecar derives its own preStop wait from this, as grace - 1, so
  # 59 here. The application reaches its database through the proxy and may keep working
  # until the last moment, so the proxy has to outlive the whole of this budget.
  terminationGracePeriodSeconds: 60

canary:
  enabled: false
  weight: 0
  deploymentContainer:
    command: []
    args: []
    # Optional: override probes for canary only (same structure as deploymentContainer).
    # If unset, canary uses the main deployment's liveness/readiness/startup probes.
    # livenessProbe: {}
    # customLivenessProbe: {}
    # readinessProbe: {}
    # customReadinessProbe: {}
    # startupProbe: {}
    # customStartupProbe: {}
  resources: {}
  service:
    annotations:
      canary: {}
      control: {}

  # Overrides the top-level podDisruptionBudget for the canary tier only.
  # Leave enabled unset to inherit the top-level enabled value. Leave both
  # minAvailable and maxUnavailable unset to inherit the top-level budget.
  # If either budget field is set, the other is not inherited: minAvailable
  # and maxUnavailable are mutually exclusive, so a partial override cannot
  # be merged with the parent. Use maxUnavailable: 0 to disallow all voluntary disruption;
  # use minAvailable: "100%" for the same effect.
  #
  # podDisruptionBudget:
  #   enabled: true
  #   minAvailable:
  #   maxUnavailable:

  # Implementation specific configurations for canary deployment
  reverseProxy:
    # Overrides the top-level podDisruptionBudget for the reverse proxy only.
    # Leave enabled unset to inherit the top-level enabled value. Leave both
    # minAvailable and maxUnavailable unset to inherit the top-level budget.
    # If either budget field is set, the other is not inherited: minAvailable
    # and maxUnavailable are mutually exclusive, so a partial override cannot
    # be merged with the parent. Use maxUnavailable: 0 to disallow all voluntary disruption;
    # use minAvailable: "100%" for the same effect.
    #
    # podDisruptionBudget:
    #   enabled: true
    #   minAvailable:
    #   maxUnavailable:

    # Overrides the effective minReadySeconds for the reverse proxy only, where
    # effective means serviceGracefulRollout when it applies and the top level
    # otherwise. The rproxy is the tier fronted by the NEG, so it often warrants a
    # longer delay than the application Deployments. Leave unset to inherit;
    # setting 0 here explicitly opts the rproxy out of a non-zero inherited value.
    # minReadySeconds:
    # Overrides the effective terminationGracePeriodSeconds for the reverse proxy
    # only, serviceGracefulRollout when it applies and the top level otherwise.
    # Being the tier fronted by the NEG, it is the one that keeps serving while its
    # endpoint is detached, so it may warrant longer than the application
    # Deployments. Leave unset to inherit.
    #
    # Unlike minReadySeconds above, this field is always rendered, so 0 is not an
    # opt out: it sets a grace period of literally 0 seconds, which SIGKILLs the
    # Pod immediately with no drain at all. It does not fall back to the
    # Kubernetes default of 30. Reaching 0 also means setting preStopSleepSeconds
    # to 0, since a preStop sleep may not outlast the grace period.
    # terminationGracePeriodSeconds:
    # Overrides the effective preStopSleepSeconds for the reverse proxy only,
    # serviceGracefulRollout when it applies and the top level otherwise. The
    # rproxy sleeps this long before quitting nginx, so it stays in the traffic
    # path until the load balancer has detached its endpoint. Leave unset to
    # inherit; setting 0 here quits nginx immediately with no drain window.
    # preStopSleepSeconds:
    # WARNING: enabling this will cause every request to be logged. That is a lot of logs.
    enableAccessLogs: false
    # Minimum number of upstreams to duplicate; the actual count: max(.Values.canary.reverseProxy.minUpstreams, .Values.autoscaling.maxReplicas)
    minUpstreams: 10
    # Timeouts for the reverse proxy. These defaults are intended for web services. If you would like to use canary for something
    # like a GCP task handler you would need to increase these limits
    send_timeout: 30s
    proxy_connect_timeout: 5s
    proxy_send_timeout: 30s
    proxy_read_timeout: 30s
    livenessProbe:
      initialDelaySeconds: 1
      failureThreshold: 3
      # The probe will be checked every 10 seconds.
      periodSeconds: 10
      # Number of times the probe is allowed to fail before the transition
      # from healthy to failure state.
      # If periodSeconds = 60, 5 tries will result in five minutes of
      # checks. The proxy starts to refresh a certificate five minutes
      # before its expiration. If those five minutes lapse without a
      # successful refresh, the liveness probe will fail and the pod will be
      # restarted.
      successThreshold: 1
      # The probe will fail if it does not respond in 10 seconds
      timeoutSeconds: 10
    readinessProbe:
      initialDelaySeconds: 1
      failureThreshold: 3
      # The probe will be checked every 10 seconds.
      periodSeconds: 10
      # Number of times the probe is allowed to fail before the transition
      # from healthy to failure state.
      # If periodSeconds = 60, 5 tries will result in five minutes of
      # checks. The proxy starts to refresh a certificate five minutes
      # before its expiration. If those five minutes lapse without a
      # successful refresh, the liveness probe will fail and the pod will be
      # restarted.
      successThreshold: 1
      # The probe will fail if it does not respond in 10 seconds
      timeoutSeconds: 10
    startupProbe:
      initialDelaySeconds: 1
      failureThreshold: 60
      periodSeconds: 1
      successThreshold: 1
      timeoutSeconds: 10
    image:
      repository: nginx
      tag: 1.27.4
    # Number of reverse proxy Pods, used only when autoscaling below is disabled.
    # Leave unset to inherit the top-level replicaCount.
    # replicaCount:
    autoscaling:
      enabled: true
      metrics: []
      # minReplicas and maxReplicas are inherited from .Values.autoscaling unless
      # set here. The inherited minimum is floored at 2, since the reverse proxy is
      # the tier fronted by the NEG and a single replica is a single endpoint: a
      # rollout or a zone move then leaves the load balancer with nothing to route
      # to. The floor never exceeds maxReplicas, so a service that deliberately
      # pins itself to one replica is left alone. Setting minReplicas here wins
      # outright over both the floor and the inherited value, including 1.
      # minReplicas:
      # maxReplicas:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 256Mi

  # Number of canary Pods, used only when .Values.autoscaling is disabled.
  # Leave unset to inherit the top-level replicaCount.
  # replicaCount:

  # HPA settings for canary deployment. ".Values.autoscaling" values are used to confiugre HPA.
  # minReplicas and/or maxReplicas can be overriten for canary with this configuration. Does not support overriding any other values.
  # autoscaling:
  #  minReplicas: 1 (defaults to .Values.autoscaling.minReplicas)
  #  maxReplicas: 10 (defaults to .Values.autoscaling.maxReplicas)
  # percentage of traffic that should be sent to canary. (100 - weight) is sent to non-canary deployment.
  # weight: 5
  # image:
  #  tag: ""

ingress:
  enabled: false
  hosts:
    - host: chart-example.local
      # The name is optional, If not set, a name is generated using host
      # name: ""
      annotations: {}
        # kubernetes.io/ingress.class: (nginx-internal or nginx-public)
        # kubernetes.io/tls-acme: "true"
      paths:
        - backend:
            service:
              name: chart-service
              port:
                number: 80
          path: /
          pathType: ImplementationSpecific
  tls: []

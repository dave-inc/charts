  #        annotations: {}
  #       ## kubernetes.io/ingress.class: (nginx-internal or nginx-public)
  #       ## kubernetes.io/tls-acme: "true"
  #        paths:
  #          - backend:
  #              service:
  #                name: chart-service-ca
  #                port:

# common.name (_helpers.tpl) wraps .Values.name in `required`, which aborts
# rendering immediately if it's unset -- even though it's also wrapped in
# `default .Release.Name`, Go templates evaluate that argument first. Every
# suite under tests/ must load this via `values:` or any template calling
# common.name (e.g. deployment.yaml) fails to render at all.
name: test-app

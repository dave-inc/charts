suite: Existing service account (serviceAccount.create false + existingNameSA)
templates:
  - serviceaccount.yaml
  - deployment.yaml
values:
  - ./fixtures/minimal-values.yaml
set:
  serviceAccount:
    create: false
    existingNameSA: existing-app-sa
tests:
  - it: does not create a ServiceAccount
    asserts:
      - template: serviceaccount.yaml
        hasDocuments:
          count: 0

  - it: resolves the Deployment's serviceAccountName to existingNameSA
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: existing-app-sa

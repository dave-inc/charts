suite: KEDA ScaledObject sync-wave
templates:
  - scaledobject.yaml
  - scaledobject-canary.yaml
  - scaledobject-rproxy.yaml
values:
  - ./fixtures/minimal-values.yaml
set:
  kedaScaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    triggers:
      - type: prometheus
        metadata:
          serverAddress: https://example.invalid
          query: up
          threshold: "5"
tests:
  - it: omits the sync-wave by default so a new Deployment can be created in the same sync
    template: scaledobject.yaml
    asserts:
      - isKind:
          of: ScaledObject
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: syncs the ScaledObject in wave -1 while migrating
    template: scaledobject.yaml
    set:
      kedaScaling.migrating: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"

  - it: follows kedaScaling.migrating for the canary tier
    template: scaledobject-canary.yaml
    set:
      canary.enabled: true
      kedaScaling.migrating: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"

  - it: omits the canary sync-wave by default
    template: scaledobject-canary.yaml
    set:
      canary.enabled: true
    asserts:
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: uses the rproxy tier's own migrating flag, independent of the top-level one
    template: scaledobject-rproxy.yaml
    set:
      canary.enabled: true
      canary.reverseProxy.kedaScaling.enabled: true
      kedaScaling.migrating: true
    asserts:
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: syncs the rproxy ScaledObject in wave -1 while that tier is migrating
    template: scaledobject-rproxy.yaml
    set:
      canary.enabled: true
      canary.reverseProxy.kedaScaling.enabled: true
      canary.reverseProxy.kedaScaling.migrating: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"

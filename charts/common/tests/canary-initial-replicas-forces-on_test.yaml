suite: canary.initialReplicas forces canary on independent of global.canary.enabled, without arming trafficRouting
templates:
  - rollout.yaml
  - service-stable.yaml
  - service-canary.yaml
values:
  - ./fixtures/minimal-values.yaml
set:
  service.enabled: true
  autoscaling.enabled: true
tests:
  - it: does nothing when neither initialReplicas nor global.canary.enabled is set
    asserts:
      - template: rollout.yaml
        hasDocuments:
          count: 0
      - template: service-stable.yaml
        hasDocuments:
          count: 0
      - template: service-canary.yaml
        hasDocuments:
          count: 0

  - it: creates the Rollout and stable/canary Services from initialReplicas alone, with global.canary.enabled still unset
    set:
      canary.initialReplicas: 5
    asserts:
      - template: rollout.yaml
        isKind:
          of: Rollout
      - template: rollout.yaml
        equal:
          path: spec.replicas
          value: 5
      - template: rollout.yaml
        equal:
          path: spec.strategy.canary.canaryService
          value: test-app-canary
      - template: rollout.yaml
        equal:
          path: spec.strategy.canary.stableService
          value: test-app-stable
      - template: service-stable.yaml
        isKind:
          of: Service
      - template: service-canary.yaml
        isKind:
          of: Service

  - it: does not arm the zero-config trafficRouting while global.canary.enabled is still unset, even with initialReplicas set
    set:
      canary.initialReplicas: 5
    asserts:
      - template: rollout.yaml
        notExists:
          path: spec.strategy.canary.trafficRouting

  - it: also omits scaleDownDelaySeconds while global.canary.enabled is still unset, even with initialReplicas set - Argo Rollouts' own validation rejects the Rollout outright ("Canary scaleDownDelaySeconds can only be used with traffic routing") if this ever renders without trafficRouting, as happened live on service-template-test-service
    set:
      canary.initialReplicas: 5
    asserts:
      - template: rollout.yaml
        notExists:
          path: spec.strategy.canary.scaleDownDelaySeconds

  - it: arms the zero-config trafficRouting once global.canary.enabled is also set
    set:
      canary.initialReplicas: 5
      global.canary.enabled: true
    asserts:
      - template: rollout.yaml
        equal:
          path: spec.strategy.canary.trafficRouting
          value:
            plugins:
              argoproj-labs/gatewayAPI:
                httpRoute: test-app
                namespace: NAMESPACE

  - it: scaleDownDelaySeconds joins trafficRouting once global.canary.enabled is also set
    set:
      canary.initialReplicas: 5
      global.canary.enabled: true
    asserts:
      - template: rollout.yaml
        equal:
          path: spec.strategy.canary.scaleDownDelaySeconds
          value: 60

  - it: still honors an explicit canary.trafficRouting override while only initialReplicas is set
    set:
      canary.initialReplicas: 5
      canary.trafficRouting:
        plugins:
          custom:
            foo: bar
    asserts:
      - template: rollout.yaml
        equal:
          path: spec.strategy.canary.trafficRouting
          value:
            plugins:
              custom:
                foo: bar

  - it: canary.enabled false still wins outright, even with initialReplicas set
    set:
      canary.enabled: false
      canary.initialReplicas: 5
    asserts:
      - template: rollout.yaml
        hasDocuments:
          count: 0
      - template: service-stable.yaml
        hasDocuments:
          count: 0
      - template: service-canary.yaml
        hasDocuments:
          count: 0

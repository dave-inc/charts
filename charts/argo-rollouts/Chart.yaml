apiVersion: v2
name: argo-rollouts
description: |
  Cluster-wide install of the Argo Rollouts controller and CRDs via the
  upstream argo-helm chart (https://github.com/argoproj/argo-helm, aliased as
  `rollouts`), running a custom-built controller image
  (us.gcr.io/internal-1-4825/argo-rollouts-controller) that bakes the Gateway
  API traffic router plugin into the stock quay.io controller image. Deploy
  once per cluster, separate from app releases. Backs the `canary.enabled`
  feature in the `common` chart, which creates Rollout resources that this
  controller reconciles.

  CRDs, RBAC, and Deployment logic all come from upstream and update
  automatically when you bump the dependency version below -- no manifests
  are vendored/hand-copied here. The Gateway API plugin's own RBAC and its
  ConfigMap entry are added on top via values (see values.yaml).
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0-beta.2

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
appVersion: "2.41.0"

dependencies:
  - name: argo-rollouts
    version: 2.41.0
    repository: https://argoproj.github.io/argo-helm
    alias: rollouts

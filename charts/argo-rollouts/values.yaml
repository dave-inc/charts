# Values below are passed through to the upstream argo-rollouts chart
# (aliased as `rollouts`). See the full set of upstream options at
# https://github.com/argoproj/argo-helm/blob/argo-rollouts-2.41.0/charts/argo-rollouts/values.yaml
rollouts:
  installCRDs: true
  clusterInstall: true

  dashboard:
    enabled: true

  controller:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 256Mi

    image:
      registry: us.gcr.io
      repository: internal-1-4825/argo-rollouts-controller
      tag: latest
      # -- Always, since the tag above is mutable.
      pullPolicy: Always

    # -- The Gateway API plugin binary is already baked into the image above
    # (see its Dockerfile) at this exact path, so no init container is needed
    # to fetch it -- unlike the ghcr.io-download approach the plugin's own
    # docs describe, this has no external dependency at controller startup.
    # NOTE: this path must NOT be under /home/argo-rollouts/plugin-bin --
    # the upstream chart unconditionally mounts an emptyDir there (see
    # deployment.yaml), which shadows anything baked into the image at that
    # path and makes the copy-on-startup step fail with "no such file or
    # directory". Keep the baked file one level up, outside that mount.
    trafficRouterPlugins:
      - name: argoproj-labs/gatewayAPI
        location: "file:///home/argo-rollouts/rollouts-plugin-trafficrouter-gatewayapi"

  # The chart's built-in ClusterRole doesn't grant the extra permissions the
  # Gateway API plugin needs, so add them here. Subject is templated so it
  # tracks the controller's actual generated ServiceAccount name/namespace.
  # (services get/list/watch/patch/create/delete is already covered by the
  # chart's own core ClusterRole rule, so it's not repeated here.)
  extraObjects:
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: argo-rollouts-gateway-api-plugin
      rules:
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["httproutes", "grpcroutes"]
          verbs: ["get", "list", "update", "patch"]
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["tcproutes", "tlsroutes"]
          verbs: ["get", "list", "update", "patch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: argo-rollouts-gateway-api-plugin
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: argo-rollouts-gateway-api-plugin
      subjects:
        - kind: ServiceAccount
          name: '{{ include "argo-rollouts.serviceAccountName" . }}'
          namespace: '{{ include "argo-rollouts.namespace" . }}'

# GCPBackendPolicies list. Each item's `name` becomes the name of the rendered
# resource (e.g. `<name>`). Names must be unique across items. A GCPBackendPolicy
# attaches GKE backend-service configuration (e.g. `timeoutSec`) to a Service.
gcpBackendPolicies:
  enabled: true
  # When an items entry rawSpec is false, the spec block will be merged with defaults defined here.
  default:
    # Default annotations applied to every rendered resource, overridable per item
    # via metadata.annotations. sync-wave "2" ensures the target Service (created
    # at sync-wave "1" by the common/cloudarmor charts) reconciles first.
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      default:
        connectionDraining:
          drainingTimeoutSec: 0
        timeoutSec: 60
        logging:
          enabled: true
      targetRef:
        group: ""
        kind: Service
  items: []
## Basic backend policy example, with defaults for all fields except the required ones:
#
#   - name: example-service
#     spec:
#       targetRef:
#         name: example-service

## Elaborated backend policy example:
#
#  - name: main
#    # Custom annotations applied to this GCPBackendPolicy resource.
#    metadata:
#      annotations:
#        example.com/some-annotation: "some-value"
#    # If true, the policy will be rendered. If false, it will be omitted.
#    enabled: true
#    rawSpec: true
#    spec:
#      default:
#        timeoutSec: 60
#      targetRef:
#        group: ""
#        kind: Service
#        name: example-service

# Routes list. Each item's `name` becomes the name of the rendered route resource
# (e.g. `<name>`). Names must be unique across items. Each entry must
# declare its `kind` (HTTPRoute or GRPCRoute) and a `spec` block.
routes:
  enabled: true
  # When an items entry rawSpec is false, the spec block will be merged with defaults defined here.
  default:
    # Default annotations applied to every rendered resource, overridable per item
    # via metadata.annotations. sync-wave "2" ensures the target Service (created
    # at sync-wave "1" by the common/cloudarmor charts) reconciles first.
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        namespace: shared-gateways
      rule:
        backendRef:
          group: ""
          kind: Service
          weight: 1
          # Default weight for the canary half of a `canary: true` backendRef
          # (see below) -- 0 so a freshly-created route sends no traffic to
          # the canary Service until Argo Rollouts' Gateway API plugin takes
          # over and starts mutating this weight as the rollout progresses.
          canaryWeight: 0
        match:
          path:
            type: PathPrefix
            value: "/"
        filter:
          type: RequestRedirect
          requestRedirect:
            scheme: https
  items: []
## Basic route example, with defaults for all fields except the required ones:
#  - name: example-service
#    spec:
#      hostnames:
#        - example-service.daveapi.io
#        - example-service.daveapi.com
#      parentRefs:
#        - name: default
#      rules:
#        - backendRefs:
#            - name: example-service
#              port: 80

## Canary route example: `canary: true` expands a single backendRef into the
## stable+canary pair (named "<name>-stable"/"<name>-canary") that the
## `common` chart always creates when its own `canary.enabled` is true.
## Turning on canary in `common` and pointing a route at the same base `name`
## here is all that's needed -- no need to hand-type both Service names.
#  - name: example-service
#    spec:
#      hostnames:
#        - example-service.daveapi.io
#      parentRefs:
#        - name: default
#      rules:
#        - backendRefs:
#            - name: example-service
#              port: 80
#              canary: true
#              # Optional overrides -- defaults are 1 (stable) and 0 (canary),
#              # which is functionally identical (100% of traffic to stable)
#              # since weight is relative between the two backendRefs.
#              # weight: 100
#              # canaryWeight: 0


# Default values for the gatewayapi chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Optional override for the resource name prefix. If empty, Release.Name is used.
name: ""

# Master toggle. When false, no Gateway API resources are rendered.
enabled: false

# Additional labels applied to all resources created by this chart.
additionalLabels: {}

# Gateways the routes in this chart will reference. The chart does not currently
# create Gateway resources itself; gateways are typically created and managed by
# the `gateway-bundle` chart in the `shared-gateways` namespace.
gateways:
  standalone: {}
  shared:
    defaultNamespace: shared-gateways
    refs:
      - name: default
        # Overrides defaultNamespace for this reference
        namespace: shared-gateways

# HealthCheckPolicies list. Each item's `name` becomes the name of the rendered
# resource (e.g. `<name>`). Names must be unique across items.
healthCheckPolicies:
  enabled: true
  # When an items entry rawSpec is false, the spec block will be merged with defaults defined here.
  default:
    # Default annotations applied to every rendered resource, overridable per item
    # via metadata.annotations. sync-wave "2" leaves time after the target
    # Service is created for its GCP-side NEG/backend registration to settle.
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      default:
        config:
          type: HTTP
        logConfig:
          enabled: true
        checkIntervalSec: 5
        timeoutSec: 1
        healthyThreshold: 2
        unhealthyThreshold: 2
      targetRef:
        group: ""
        kind: Service
  items: []
## Basic health check policy example, with defaults for all fields except the required ones:
#
#   - name: example-service
#     spec:
#       default:
#         config:
#           httpHealthCheck:
#             port: 8080
#             requestPath: /
#      targetRef:
#        name: example-service

## Elaborated health check policy example:
#
#  - name: main
#    # Custom annotations applied to this HealthCheckPolicy resource.
#    metadata:
#      annotations:
#        example.com/some-annotation: "some-value"
#    # If true, the policy will be rendered. If false, it will be omitted.
#    enabled: true
#    rawSpec: true
#    spec:
#      default:
#        checkIntervalSec: 10
#        config:
#          httpHealthCheck:
#            # This needs to be the pod's port, or targetPort in the svc
#            port: 8080
#            requestPath: /
#          type: HTTP
#        healthyThreshold: 1
#        logConfig:
#          enabled: true
#        timeoutSec: 1
#        unhealthyThreshold: 3
#      targetRef:
#        group: ""
#        kind: Service
#        name: example-service

# GCPBackendPolicies list. Each item's `name` becomes the name of the rendered
# resource (e.g. `<name>`). Names must be unique across items. A GCPBackendPolicy
# attaches GKE backend-service configuration (e.g. `timeoutSec`) to a Service.
gcpBackendPolicies:
  enabled: true
  # When an items entry rawSpec is false, the spec block will be merged with defaults defined here.
  default:
    # Default annotations applied to every rendered resource, overridable per item
    # via metadata.annotations. sync-wave "2" leaves time after the target
    # Service is created for its GCP-side NEG/backend registration to settle.
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      default:
        connectionDraining:
          drainingTimeoutSec: 7
        timeoutSec: 60
        logging:
          enabled: true
      # NOTE: there is deliberately no chart-wide `securityPolicy` default.
      # Cloud Armor is per-item only (see the example below). Because GKE reads
      # an explicit empty string as "detach the attached policy", an item could
      # not opt out of a chart-wide default without also detaching its policy.
      targetRef:
        group: ""
        kind: Service
  items: []
## Basic backend policy example, with defaults for all fields except the required ones:
#
#   - name: example-service
#     spec:
#       targetRef:
#         name: example-service

## Cloud Armor example. `securityPolicy` names a pre-existing Cloud Armor
## security policy in GCP; the chart does not create it. Its scope must match
## the GatewayClass: a global policy for gke-l7-global-external-managed, a
## regional policy in the cluster's region for gke-l7-regional-external-managed
## or gke-l7-rilb.
##
## Three states, and they are NOT interchangeable:
##   - key omitted           -> leaves whatever policy is attached untouched
##   - securityPolicy: name  -> attaches that policy
##   - securityPolicy: ""    -> DETACHES the attached policy
## So remove the line to stop managing the policy; do not blank it out.
#
#   - name: example-service
#     spec:
#       default:
#         securityPolicy: example-service-ca
#       targetRef:
#         name: example-service

## Elaborated backend policy example:
#
#  - name: main
#    # Custom annotations applied to this GCPBackendPolicy resource.
#    metadata:
#      annotations:
#        example.com/some-annotation: "some-value"
#    # If true, the policy will be rendered. If false, it will be omitted.
#    enabled: true
#    rawSpec: true
#    spec:
#      default:
#        timeoutSec: 60
#        # Pre-existing Cloud Armor policy name. Set to "" to detach.
#        securityPolicy: example-service-ca
#      targetRef:
#        group: ""
#        kind: Service
#        name: example-service

# Routes list. Each item's `name` becomes the name of the rendered route resource
# (e.g. `<name>`). Names must be unique across items. Each entry must
# declare its `kind` (HTTPRoute or GRPCRoute) and a `spec` block.
routes:
  enabled: true
  # When an items entry rawSpec is false, the spec block will be merged with defaults defined here.
  default:
    # Default annotations applied to every rendered resource, overridable per item
    # via metadata.annotations. sync-wave "2" leaves time after the target
    # Service is created for its GCP-side NEG/backend registration to settle.
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        namespace: shared-gateways
      rule:
        backendRef:
          group: ""
          kind: Service
          weight: 1
          # Default weight for the canary half of the pair every backendRef
          # expands into when `global.canary.enabled` is true (see below) --
          # 0 so a freshly-created route sends no traffic to the canary
          # Service until Argo Rollouts' Gateway API plugin takes over and
          # starts mutating this weight as the rollout progresses.
          canaryWeight: 0
        match:
          path:
            type: PathPrefix
            value: "/"
        filter:
          type: RequestRedirect
          requestRedirect:
            scheme: https
  items: []
## Basic route example, with defaults for all fields except the required ones:
#  - name: example-service
#    spec:
#      hostnames:
#        - example-service.daveapi.io
#        - example-service.daveapi.com
#      parentRefs:
#        - name: default
#      rules:
#        - backendRefs:
#            - name: example-service
#              port: 80

## Canary route example: whenever `global.canary.enabled` is true (a single
## toggle set once at the umbrella-chart level and shared automatically with
## every subchart, including `common` -- see
## charts/common/templates/_helpers.tpl `common.canaryEnabled`), every
## backendRef here expands into the stable+canary pair (named
## "<name>-stable"/"<name>-canary") that the `common` chart always creates
## in that case. Pointing a route at the same base `name` is all that's
## needed -- no need to hand-type both Service names, and no per-backendRef
## setting to turn on.
#  - name: example-service
#    spec:
#      hostnames:
#        - example-service.daveapi.io
#      parentRefs:
#        - name: default
#      rules:
#        - backendRefs:
#            - name: example-service
#              port: 80
#              # Optional overrides -- defaults are 1 (stable) and 0 (canary),
#              # which is functionally identical (100% of traffic to stable)
#              # since weight is relative between the two backendRefs.
#              # weight: 100
#              # canaryWeight: 0


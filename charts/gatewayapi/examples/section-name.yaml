enabled: true
routes:
  items:
    - name: example-service
      spec:
        hostnames:
          - example-service.trydave.com
        parentRefs:
          - name: default
            sectionName: custom-section-name
        rules:
          - backendRefs:
              - name: example-service
                port: 80
healthCheckPolicies:
  items:
    - name: example-service
      spec:
        default:
          config:
            httpHealthCheck:
              port: 8080
              requestPath: /healthz
        targetRef:
          name: example-service
gcpBackendPolicies:
  items:
    - name: example-service
      spec:
        targetRef:
          name: example-service

{{- if .Values.policySets.common.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: hpa-rproxy
  namespace: {{ .Values.policySets.common.namespace }}
  labels:
    {{- include "kyverno-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Reverse-Proxy HPA / ScaledObject Minimum Replicas >= 2
    policies.kyverno.io/category: {{ .Values.policySets.common.hpaRProxy.category }}
    policies.kyverno.io/severity: {{ .Values.policySets.common.hpaRProxy.severity }}
    policies.kyverno.io/subject: "HorizontalPodAutoscaler / ScaledObject"
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      When canary is enabled, the common chart deploys an nginx reverse-proxy
      HPA / ScaledObject named {app}-rproxy that splits traffic between stable and canary.
      That HPA / ScaledObject must set minReplicas >= 2 to avoid a single point of failure.
spec:
  validationFailureAction: {{ .Values.policySets.common.hpaRProxy.validationFailureAction }}
  background: true
  rules:
    - name: hpa-rproxy-min-replicas
      match:
        any:
        - resources:
            kinds:
            - HorizontalPodAutoscaler
            - keda.sh/v1alpha1/ScaledObject
      exclude:
        {{ .Values.policySets.common.hpaRProxy.exclude | toYaml | nindent 8 }}

      context:
        - name: minReplicas
          variable:
            jmesPath: "request.object.spec.minReplicas || request.object.spec.minReplicaCount"
            default: 1

      preconditions:
        all:
        - key: "{{`{{ request.object.metadata.name }}`}}"
          operator: Equals
          value: "*-rproxy"

      validate:
        message: "Canary rproxy minReplicas/minReplicaCount must be >= 2. Set canary.reverseProxy.autoscaling.minReplicas (HPA) or the equivalent KEDA minReplicaCount in the common chart values."
        deny:
          conditions:
            any:
              - key: "{{`{{ minReplicas }}`}}"
                operator: LessThan
                value: 2
{{- end }}

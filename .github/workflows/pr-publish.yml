name: Publish PR charts

on:
  pull_request:
    paths:
      - 'charts/**'

concurrency:
  group: pr-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Keep Helm in step with release.yml and lint.yml.
env:
  HELM_VERSION: v4.2.4
  HELM_OCI_REGISTRY: oci://us-docker.pkg.dev/artifact-storage-5748/helm-charts-pr
  WIF_PROVIDER: projects/973400095566/locations/global/workloadIdentityPools/gha-pool-staging-daveinc/providers/gha-provider-staging-daveinc

jobs:
  # Packages each changed chart at <chartversion>-pr<PR>.<run_id> and pushes it
  # to helm-charts-pr. Trigger is pull_request only, so the GitHub OIDC sub is
  # repo:dave-inc/charts:pull_request. That is the only principal that can write
  # this repo. Do not set environment:. Do not set service_account.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Print GitHub OIDC sub
        env:
          WIF_PROVIDER: ${{ env.WIF_PROVIDER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, base64
          from urllib.parse import quote
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          req_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          aud = "https://iam.googleapis.com/" + os.environ["WIF_PROVIDER"]
          req = urllib.request.Request(
              url + "&audience=" + quote(aud, safe=""),
              headers={"Authorization": f"bearer {req_token}"},
          )
          with urllib.request.urlopen(req) as resp:
              jwt = json.load(resp)["value"]
          payload = jwt.split(".")[1]
          pad = "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload + pad))
          for key in ("sub", "repository", "ref", "environment"):
              print(f"{key}={claims.get(key, '')}")
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: artifact-storage-5748
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Package and push changed charts
        id: push
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "$BASE_SHA"
          mkdir -p .pr-packages

          mapfile -t charts < <(
            git diff --name-only "$BASE_SHA"...HEAD |
              awk -F/ '$1=="charts" && NF>=2 {print $1 "/" $2}' |
              sort -u
          )

          if [ "${#charts[@]}" -eq 0 ]; then
            echo "published=" >> "$GITHUB_OUTPUT"
            echo "No charts changed"
            exit 0
          fi

          published=""
          for dir in "${charts[@]}"; do
            [ -f "$dir/Chart.yaml" ] || continue
            name=$(awk '/^name:/{gsub(/[" ]/,"",$2); print $2; exit}' "$dir/Chart.yaml")
            base=$(awk '/^version:/{gsub(/[" ]/,"",$2); print $2; exit}' "$dir/Chart.yaml")
            ver="${base}-pr${PR_NUMBER}.${RUN_ID}"
            echo "::group::package $dir as $ver"
            helm dependency update "$dir"
            helm package "$dir" --version "$ver" -d .pr-packages
            echo "::endgroup::"
            echo "::group::push $name $ver"
            helm push ".pr-packages/${name}-${ver}.tgz" "$HELM_OCI_REGISTRY"
            if ! helm show chart "${HELM_OCI_REGISTRY}/${name}" --version "$ver" >/dev/null; then
              echo "::error::$name $ver is missing from $HELM_OCI_REGISTRY"
              exit 1
            fi
            published="${published}${name} ${ver}"$'\n'
            echo "::endgroup::"
          done

          {
            echo "published<<EOF"
            printf '%s' "$published"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment published versions
        if: steps.push.outputs.published != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.push.outputs.published }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="$(printf '%s\n' \
            '<!-- helm-charts-pr -->' \
            'Per-PR charts pushed to `oci://us-docker.pkg.dev/artifact-storage-5748/helm-charts-pr`.' \
            '' \
            'Pin with the exact version. Helm hides prerelease tags from search unless `--devel` is passed.' \
            '' \
            '```' \
            "${PUBLISHED}" \
            '```')"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- helm-charts-pr -->")) | .id' | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -f body="$body"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$body"
          fi

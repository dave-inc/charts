name: Helm Lint

on:
  pull_request:
    branches:
      - '**'

env:
  HELM_VERSION: v4.2.4

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint every chart
        run: |
          set -euo pipefail
          for dir in charts/*/; do
            [ -f "$dir/Chart.yaml" ] || continue
            echo "::group::helm lint $dir"
            # Subcharts must be vendored first. helm lint only warns about missing
            # dependencies, but helm package later fails outright.
            helm dependency update "$dir"
            helm lint "$dir"
            echo "::endgroup::"
          done

      # release-please only releases charts it is configured for. A chart missing
      # from either file is silently frozen at its current version, which is the
      # kind of failure nobody notices until a release is expected and absent.
      - name: Verify release-please covers every chart
        run: |
          set -euo pipefail
          fail=0

          charts=$(find charts -mindepth 2 -maxdepth 2 -name Chart.yaml | xargs -n1 dirname | sort)
          configured=$(jq -r '.packages | keys[]' release-please-config.json | sort)
          manifested=$(jq -r 'keys[]' .release-please-manifest.json | sort)

          if ! diff <(echo "$charts") <(echo "$configured") > /dev/null; then
            echo "::error::release-please-config.json packages do not match chart directories"
            diff <(echo "$charts") <(echo "$configured") || true
            fail=1
          fi

          if ! diff <(echo "$charts") <(echo "$manifested") > /dev/null; then
            echo "::error::.release-please-manifest.json entries do not match chart directories"
            diff <(echo "$charts") <(echo "$manifested") || true
            fail=1
          fi

          # The helm strategy derives the release tag component from Chart.yaml's
          # `name`, while chart-releaser derives it from the directory name. If they
          # disagree the two tools tag different things.
          for dir in $charts; do
            name=$(yq -r '.name' "$dir/Chart.yaml")
            base=$(basename "$dir")
            if [ "$name" != "$base" ]; then
              echo "::error::$dir/Chart.yaml name '$name' does not match directory '$base'"
              fail=1
            fi
          done

          exit $fail

      # values.schema.json is generated from schemas/ but committed to the repo.
      # Nothing regenerates it at release time, so this check is what keeps the
      # committed file from drifting away from its sources.
      - name: Verify values.schema.json is current
        run: |
          set -euo pipefail
          npm install -g @skriptfabrik/json-schema-bundler
          for dir in charts/*/; do
            [ -f "$dir/schemas/schema.yaml" ] || continue
            (cd "$dir" && json-schema-bundler -d schemas/schema.yaml | jq . > values.schema.json)
          done
          if ! git diff --exit-code -- '**/values.schema.json'; then
            echo "::error::values.schema.json is stale. Run 'make schemas' and commit the result."
            exit 1
          fi

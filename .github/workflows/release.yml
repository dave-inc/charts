name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Keep in step with the same variable in lint.yml. Packaging a chart with a
# different Helm than the one that linted it is how a chart passes CI and then
# fails to install.
env:
  HELM_VERSION: v4.2.4
  HELM_OCI_REGISTRY: oci://us-docker.pkg.dev/artifact-storage-5748/helm-charts
  WIF_PROVIDER: projects/973400095566/locations/global/workloadIdentityPools/gha-pool-staging-daveinc/providers/gha-provider-staging-daveinc

jobs:
  # Opens/updates a PR that bumps `version` in each changed chart's Chart.yaml and
  # writes its CHANGELOG.md. Charts are attributed by file path, so a commit only
  # affects the charts it actually touches.
  #
  # When that PR is merged, this same job creates the git tag and the GitHub
  # Release, with the per-release changelog as the release body. The publish job
  # below then pushes each packaged chart to Artifact Registry and attaches the
  # `.tgz` to that GitHub Release.
  #
  # Opening the PR fails with "GitHub Actions is not permitted to create or
  # approve pull requests" unless either the repo enables that setting or this
  # runs as something other than GITHUB_TOKEN. See docs/repo-setup.md.
  #
  # workflow_dispatch can target any branch. The action is pinned to master,
  # so a feature-branch dispatch would still create GitHub Releases while
  # publish authenticates as that branch and 403s on WIF. Later master runs
  # then see the Releases and skip the push. Limit the job so those
  # dispatches really do nothing.
  release-please:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      release_sha: ${{ steps.released.outputs.sha }}
    steps:
      # Dave's org IP allow list does not include GitHub-hosted runner IPs.
      # This service key sends github.com through a Connector whose egress is
      # allow-listed. Same action and pin as the old chart-releaser job.
      - name: Connect to Twingate
        uses: twingate/github-action@a8e6c2471f32650531a4683f45e485a2e97e048c # v1.5
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      # Minted per run and revoked when the job ends, so no long-lived credential
      # is stored on the repo. `continue-on-error` falls back to GITHUB_TOKEN
      # below when the app is not installed or its secrets are absent.
      #
      # This calls the same action, at the same version, that
      # dave-inc/common-workflows wraps. Using the wrapper directly would make
      # this job fail at "Set up job" anywhere that private repo cannot be
      # resolved, and action resolution happens before continue-on-error applies.
      #
      # `owner` is deliberately unset. Setting it without also setting
      # `repositories` scopes the token to every repo in the installation rather
      # than to this one. Left out, both default to the current repository.
      - name: Mint an app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVX_GH_APP_ID }}
          private-key: ${{ secrets.DEVX_GH_APP_S_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The action evaluates master at runtime, not the event SHA. A queued
      # run with cancel-in-progress: false can therefore tag a newer commit
      # and, without this, package the older push. Take the sha it tagged.
      - name: Capture released commit
        id: released
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          set -euo pipefail
          path=$(jq -r 'try ((.paths_released // "[]") | if type == "string" then fromjson else . end) catch [] | .[0] // empty' <<<"$RELEASE_OUTPUTS")
          sha=""
          if [ -n "$path" ]; then
            sha=$(jq -r --arg k "${path}--sha" '.[$k] // empty' <<<"$RELEASE_OUTPUTS")
          fi
          if [ -z "$sha" ]; then
            echo "::error::release-please created a release but did not output a sha; not packaging master HEAD"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Queues the release PR to merge itself once its checks pass and it has the
      # approval master's branch protection requires. This does not skip that
      # approval, it removes the second trip where whoever approved has to come back
      # later and press merge.
      #
      # Re-arming an already-armed PR is a no-op, so running this on every push is
      # harmless. Failure is not fatal: without `allow_auto_merge` on the repo this
      # step is the only thing that breaks, and the release PR is still merged by
      # hand exactly as before. See docs/repo-setup.md.
      - name: Queue the release PR to merge itself
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ fromJSON(steps.release.outputs.pr || '{"number":0}').number }}
        run: |
          set -uo pipefail
          if gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"; then
            echo "release PR #$PR will merge once its checks and approval land"
          else
            echo "::warning::Could not arm auto-merge on #$PR. Is allow_auto_merge enabled? See docs/repo-setup.md."
          fi

  # Packages the charts release-please just released, pushes them to Artifact
  # Registry as OCI, and attaches each `.tgz` to the GitHub Release. Kyverno Scan
  # in dave-inc/sre still downloads that asset. GitHub Pages / chart-releaser
  # are not written. Historical index.yaml stays as an archive.
  #
  # Auth is direct WIF against gha-provider-staging-daveinc. Do not set
  # service_account. Do not set environment: on this job; that changes the
  # GitHub OIDC sub and prod IAM will 403. The job only runs on master, so
  # the expected sub is repo:dave-inc/charts:ref:refs/heads/master.
  #
  # gh release upload talks to github.com, so this job needs Twingate the same
  # way release-please does. GITHUB_TOKEN with contents: write is enough to
  # attach assets to a Release in this repo.
  #
  # Blocked on SRE-7517 applying helm-charts in artifact-storage-5748.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Connect to Twingate
        uses: twingate/github-action@a8e6c2471f32650531a4683f45e485a2e97e048c # v1.5
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Print GitHub OIDC sub
        env:
          WIF_PROVIDER: ${{ env.WIF_PROVIDER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, base64
          from urllib.parse import quote
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          req_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          aud = "https://iam.googleapis.com/" + os.environ["WIF_PROVIDER"]
          req = urllib.request.Request(
              url + "&audience=" + quote(aud, safe=""),
              headers={"Authorization": f"bearer {req_token}"},
          )
          with urllib.request.urlopen(req) as resp:
              jwt = json.load(resp)["value"]
          payload = jwt.split(".")[1]
          pad = "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload + pad))
          for key in ("sub", "repository", "ref", "environment"):
              print(f"{key}={claims.get(key, '')}")
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: artifact-storage-5748
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Package and push released charts
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .release-packages

          mapfile -t dirs < <(jq -r '.[]' <<<"$PATHS_RELEASED")
          for dir in "${dirs[@]}"; do
            echo "::group::package $dir"
            helm dependency update "$dir"
            helm package "$dir" -d .release-packages
            echo "::endgroup::"
          done

          missing=0
          for pkg in .release-packages/*.tgz; do
            name=$(helm show chart "$pkg" | yq -r '.name')
            version=$(helm show chart "$pkg" | yq -r '.version')
            tag="${name}-${version}"
            echo "::group::push $name $version"
            helm push "$pkg" "$HELM_OCI_REGISTRY"
            gh release upload "$tag" "$pkg" --clobber --repo "$GITHUB_REPOSITORY"
            if ! helm show chart "${HELM_OCI_REGISTRY}/${name}" --version "$version" >/dev/null; then
              echo "::error::$name $version is missing from $HELM_OCI_REGISTRY"
              missing=1
            else
              echo "ok $name $version"
            fi
            echo "::endgroup::"
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Re-run this job to repair the OCI push. See docs/release-pipeline.md."
            exit 1
          fi

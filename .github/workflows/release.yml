name: Release Charts

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      skip_existing:
        type: boolean
        default: false
        description: >-
          Passed through to chart-releaser's skip_existing option: skip
          re-uploading a chart version that's already published, instead of
          trying to recreate its GitHub Release and failing with a 422 from
          GitHub's API.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Twingate
        uses: twingate/github-action@a8e6c2471f32650531a4683f45e485a2e97e048c # v1.5
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY}}
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@a0d2dc62c5e491af8ef6ba64a2e02bcf3fb33aa1 # v1.7.0
        with:
          skip_existing: ${{ inputs.skip_existing }}
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

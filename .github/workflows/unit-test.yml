name: Helm Unit Tests

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2 --verify=false # resolves to 33c48cac798e465deda9a66c8e6c07c0973cf53d

      - name: Run Helm Unit Tests
        run: make test

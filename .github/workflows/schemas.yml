name: Bundle Schemas

on:
  pull_request:
    paths:
      - "charts/*/schemas/**"
      - "Makefile"
      - ".github/workflows/schemas.yml"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `pull_request` checks out a detached merge commit by default, which
          # cannot be pushed back to the branch. The previous version of this
          # workflow omitted this, which is why its commit step never worked and
          # ended up disabled.
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # A push made with GITHUB_TOKEN does not start new workflow runs, so the
          # required checks would never report on the commit this job creates and
          # the PR would sit unmergeable. AUTOMATION_TOKEN avoids that.
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Regenerate values.schema.json
        run: make schemas

      - name: Commit if changed
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          if git diff --quiet -- '**/values.schema.json'; then
            echo "values.schema.json already matches schemas/, nothing to do"
            exit 0
          fi

          echo "Charts with a stale bundled schema:"
          git diff --name-only -- '**/values.schema.json'

          # Pushing into a contributor's fork needs credentials this job does not
          # have, so say what to run rather than failing with a git error.
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::This PR is from a fork, so the schema cannot be regenerated for you."
            echo "::error::Run 'make schemas' locally and commit the result."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/values.schema.json'
          git commit -m "chore(schemas): regenerate values.schema.json"
          git push

name: Bundle Schemas

on:
  pull_request:
    paths:
      - "charts/*/schemas/**"
      - "Makefile"
      - ".github/workflows/schemas.yml"

# GITHUB_TOKEN stays read-only. The push uses a separately minted app token,
# and only after `make schemas` has finished.
permissions:
  contents: read

# Key by PR number. github.head_ref is only the branch name, so two fork PRs
# both named `feature` would cancel each other.
concurrency:
  group: schemas-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      # No token, and credentials are not left in .git/config. `make schemas`
      # runs `npx` against whatever this branch pins; that must not see a write
      # token.
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # `pull_request` checks out a detached merge commit by default, which
          # cannot be pushed back to the branch. The previous version of this
          # workflow omitted this, which is why its commit step never worked and
          # ended up disabled.
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Regenerate values.schema.json
        run: make schemas

      - name: Detect schema changes
        id: diff
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          # git diff ignores untracked files. A new chart's values.schema.json
          # would otherwise look "clean" and never get committed.
          find charts -maxdepth 2 -name values.schema.json -exec git add -- {} +

          if git diff --cached --quiet; then
            echo "values.schema.json already matches schemas/, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Charts with a stale bundled schema:"
          git diff --cached --name-only

          if [ "$IS_FORK" = "true" ]; then
            echo "::error::This PR is from a fork, so the schema cannot be regenerated for you."
            echo "::error::Run 'make schemas' locally and commit the result."
            exit 1
          fi

      # GitHub does not start workflow runs from anything done with GITHUB_TOKEN,
      # so a schema commit pushed with it leaves the PR's checks reporting against
      # the previous commit. Same-repo pushes therefore require the app token.
      # There is no GITHUB_TOKEN fallback on this path.
      #
      # This calls the same action, at the same version, that
      # dave-inc/common-workflows wraps. Using the wrapper directly would make
      # this job fail at "Set up job" anywhere that private repo cannot be
      # resolved, and action resolution happens before continue-on-error applies.
      #
      # `owner` is deliberately unset. Setting it without `repositories` widens
      # the token to every repo in the installation. Contents is the only
      # permission the push needs.
      - name: Mint an app token
        id: app-token
        if: steps.diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.DEVX_GH_APP_ID }}
          private-key: ${{ secrets.DEVX_GH_APP_S_KEY }}
          permission-contents: write

      - name: Commit if changed
        if: steps.diff.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(schemas): regenerate values.schema.json"
          git push \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

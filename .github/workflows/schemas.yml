name: Bundle Schemas

on:
  pull_request:
    paths:
      - "charts/*/schemas/**"
      - "Makefile"
      - ".github/workflows/schemas.yml"

permissions:
  contents: write

# Two pushes in quick succession would otherwise race, and the second run's push
# fails as a non-fast-forward, showing up as a failed check on the PR.
concurrency:
  group: schemas-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      # GitHub does not start workflow runs from anything done with GITHUB_TOKEN,
      # so a schema commit pushed with it leaves the PR's checks reporting against
      # the previous commit. The app token is not subject to that, and it is
      # minted per run rather than stored, so there is no long-lived secret here.
      #
      # `continue-on-error` falls back to GITHUB_TOKEN below when the app is not
      # installed or its secrets are absent.
      #
      # This calls the same action, at the same version, that
      # dave-inc/common-workflows wraps. Using the wrapper directly would make
      # this job fail at "Set up job" anywhere that private repo cannot be
      # resolved, and action resolution happens before continue-on-error applies.
      #
      # Scope matters more here than in release.yml. This job checks out branch
      # code and runs `make schemas`, which is `npx` against a package.json this
      # repo does not control, with the token sitting in .git/config. `owner` is
      # therefore deliberately unset: setting it without `repositories` widens the
      # token to every repo in the installation, whereas leaving both out defaults
      # to this one. Contents is the only permission the push needs.
      - name: Mint an app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.DEVX_GH_APP_ID }}
          private-key: ${{ secrets.DEVX_GH_APP_S_KEY }}
          permission-contents: write

      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `pull_request` checks out a detached merge commit by default, which
          # cannot be pushed back to the branch. The previous version of this
          # workflow omitted this, which is why its commit step never worked and
          # ended up disabled.
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Regenerate values.schema.json
        run: make schemas

      - name: Commit if changed
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          if git diff --quiet -- '**/values.schema.json'; then
            echo "values.schema.json already matches schemas/, nothing to do"
            exit 0
          fi

          echo "Charts with a stale bundled schema:"
          git diff --name-only -- '**/values.schema.json'

          # Pushing into a contributor's fork needs credentials this job does not
          # have, so say what to run rather than failing with a git error.
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::This PR is from a fork, so the schema cannot be regenerated for you."
            echo "::error::Run 'make schemas' locally and commit the result."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/values.schema.json'
          git commit -m "chore(schemas): regenerate values.schema.json"
          git push
